name: Daily Summary Bot

on:
  schedule:
    # ساعت ۲۱:۰۰ شب به وقت ایران (۱۷:۳۰ به وقت UTC)
    - cron: '30 17 * * *'
  workflow_dispatch: # دکمه اجرای دستی

jobs:
  run-summary:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install requirements
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Summary Script
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
        EITAA_CHAT_ID: ${{ secrets.EITAA_CHAT_ID }}
        MODE: "summary" # به بات میگه الان وقت گزارش روزانه‌ست
      run: python main.py

    - name: Save changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add daily_prices.txt || true
        git commit -m "Reset daily prices for tomorrow [skip ci]" || true
        git push || true