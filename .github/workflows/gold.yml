name: Gold Price Bot

on:
  schedule:
    - cron: '*/15 5-17 * * *'
  workflow_dispatch:

permissions:
  contents: write  # 🔑 قفل دسترسی نوشتن و پوش کردن با این خط باز میشه

jobs:
  check-price:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install requirements
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Price Bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
        EITAA_CHAT_ID: ${{ secrets.EITAA_CHAT_ID }}
        MODE: "price"
      run: python main.py

    - name: Save Changes to GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add daily_prices.txt last_price.txt || true
        git commit -m "Save today's prices [skip ci]" || true
        git push origin HEAD:${{ github.ref }} || true