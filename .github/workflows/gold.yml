name: Gold Price Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# این همون دسترسی طلاییه که گیت‌هاب برای ذخیره دیتابیس می‌خواد
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 jdatetime tzdata

      - name: Run Python Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          EITAA_CHAT_ID: ${{ secrets.EITAA_CHAT_ID }}
        run: python main.py

      - name: Save State to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bot_state.json
          git commit -m "Auto-update gold price state" || echo "No changes to commit"
          git pull --rebase || echo "Nothing to pull"
          git push