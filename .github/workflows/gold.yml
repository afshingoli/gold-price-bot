name: Gold Price Bot

on:
  push:
    branches:
      - main
      - master
  schedule:
    # این یعنی ربات هر ۱۵ دقیقه یک‌بار اتوماتیک اجرا میشه
    - cron: '*/15 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install requirements
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bot Script
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
        EITAA_CHAT_ID: ${{ secrets.EITAA_CHAT_ID }}
      run: python main.py

    - name: Save changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add last_price.txt daily_prices.txt || true
        git commit -m "Update last price [skip ci]" || true
        git push || true